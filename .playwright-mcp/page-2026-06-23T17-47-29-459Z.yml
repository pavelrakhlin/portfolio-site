              - 'heading "Direction 2 — The Right-Hand: the indispensable helper" [level=2] [ref=e74]'
              - paragraph [ref=e75]: "A right-hand is someone's most trusted, reliable assistant — working away in the background so the expert can focus on the task that matters. The attributes: dependable (constant, knows your needs), discreet (unintrusive, modest, subtle), and astute (knows what you need before you do). The language expresses an assistant that is present without being in the way."
