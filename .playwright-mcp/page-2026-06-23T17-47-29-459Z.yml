              - paragraph [ref=e82]: "Like fire before it, AI changes the way we do everything — and instead of consuming us, it reignites the spark. This direction frames AI Native as a powerful new tool that helps experts shine, with attributes of optimism (illuminated, glowing), enlightenment (clear, direct), and transformation (fluid, adaptive). Material cues: warm, flame, soft, glowing."
