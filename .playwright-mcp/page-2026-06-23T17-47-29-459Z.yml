            - generic [ref=e45]:
              - heading "The shift" [level=2] [ref=e46]
              - paragraph [ref=e47]: "AI Native IEP is the foundation of a new generation of expert experiences — a GenAI-powered platform that changes how experts handle calls and cases. It marks a paradigm shift away from static, navigation-heavy systems toward a fluid, anticipatory interface where information, tools, and insights arrive at the right moment. The challenge: codify that vision into a design language that feels alive, intelligent, and distinctly AI-native — not as a theme or aesthetic, but as a philosophy of interaction."
            - 'button "Enlarge video: The four design principles laid out as an animated arc diagram." [ref=e49]':
              - generic "The four design principles laid out as an animated arc diagram." [ref=e50]
          - generic [ref=e51]:
            - generic [ref=e52]:
              - heading "Principles as a foundation" [level=2] [ref=e53]
              - paragraph [ref=e54]: "Four principles grounded every decision. Deliver an outcome, not just an output — interfaces that don't only show, but do. Information is always at hand, but never in the way. We are the hammer, not the house — every pixel exists to empower experts to serve customers confidently. And design for imperfection: AI outputs won't always be right, so experts always have a path to take control."
            - 'button "Enlarge video: The four design principles laid out as an animated arc diagram." [ref=e56]':
              - generic "The four design principles laid out as an animated arc diagram." [ref=e57]
          - generic [ref=e58]:
            - generic [ref=e59]:
              - heading "The creative challenge" [level=2] [ref=e60]
              - paragraph [ref=e61]: "How might we express the intelligence, adaptability, and humanity of AI Native through its design language? The target qualities: Fluid — adaptive, responsive, always in motion. Intentional — purposeful hierarchy through behavior and anticipation. Human — trustworthy, empathetic, emotionally resonant. Intelligent — guided by context and foresight, not just data. Rather than commit early, we explored several distinct creative directions to find what AI Native could look, feel, and behave like."
