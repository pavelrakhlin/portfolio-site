              - 'heading "Direction 1 — Salt: the quiet catalyst" [level=2] [ref=e67]'
              - paragraph [ref=e68]: "Salt is essential yet invisible: it enhances everything around it, brings balance, and reveals depth without taking center stage. Like a chef balancing flavors, the modern expert understands that great work comes from harmony — and AI is the understated enhancer that elevates human ability without overpowering it. The visual language leans on balance and restraint, with material cues of glass, translucence, crystalline structure, and shimmer."
